<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClefSwap — Convert & Play Sheet Music</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html-midi-player: browser MIDI playback with GM soundfonts -->
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#1a1a2e; --gold:#e2b714; --gold-dark:#c9a010; --cream:#faf8f0; }
    body { background:var(--navy); font-family:'Inter',sans-serif; color:var(--cream); margin:0; }
    h1 { font-family:'Playfair Display',serif; }
    .drop-zone { border:2px dashed rgba(226,183,20,0.4); transition:border-color 0.2s,background 0.2s; }
    .drop-zone.over { border-color:var(--gold); background:rgba(226,183,20,0.06); }
    .btn-gold { background:var(--gold); color:var(--navy); font-weight:600; transition:background 0.15s,transform 0.1s; }
    .btn-gold:hover:not(:disabled) { background:var(--gold-dark); }
    .btn-gold:active:not(:disabled) { transform:scale(0.98); }
    .btn-gold:disabled { opacity:0.4; cursor:not-allowed; }
    .btn-outline { border:1.5px solid rgba(226,183,20,0.4); color:var(--gold); transition:border-color 0.2s,background 0.2s; }
    .btn-outline:hover:not(:disabled) { border-color:var(--gold); background:rgba(226,183,20,0.07); }
    .btn-outline:disabled { opacity:0.4; cursor:not-allowed; }
    select { background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.12); color:var(--cream); }
    select:focus { border-color:var(--gold); outline:none; }
    select option { background:#1a1a2e; }
    .spinner { width:24px; height:24px; border:3px solid rgba(226,183,20,0.2); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    midi-player { --primary-color:var(--gold); width:100%; display:block; border-radius:8px; overflow:hidden; }
    .wizard-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px; }
    .wizard-card { background:#1c1c32; border:1.5px solid rgba(226,183,20,0.3); border-radius:16px; padding:28px; max-width:480px; width:100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;
const API = 'http://localhost:8000';

function fmtBytes(b) {
  if (b < 1024) return b+' B';
  if (b < 1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

function MidiPlayer({ src, label }) {
  if (!src) return null;
  return (
    <div className="space-y-1">
      {label && <p className="text-xs" style={{color:'rgba(250,248,240,0.4)'}}>{label}</p>}
      <midi-player src={src} sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus"></midi-player>
    </div>
  );
}

function WizardStep({ measure, total, current, onAccept, onSkip }) {
  return (
    <div className="wizard-overlay">
      <div className="wizard-card space-y-5">
        <div className="flex justify-between items-center">
          <h2 className="text-lg font-bold" style={{fontFamily:'Playfair Display,serif',color:'var(--gold)'}}>
            Range Adjustment
          </h2>
          <span className="text-xs" style={{color:'rgba(250,248,240,0.35)'}}>{current} of {total}</span>
        </div>

        <div className="rounded-lg p-4 space-y-1" style={{background:'rgba(251,191,36,0.08)',border:'1px solid rgba(251,191,36,0.2)'}}>
          <p className="text-sm font-semibold" style={{color:'#fbbf24'}}>
            &#9888; Measure {measure.measure_number}
          </p>
          <p className="text-sm" style={{color:'rgba(250,248,240,0.6)'}}>
            Note <strong style={{color:'var(--cream)'}}>{measure.worst_pitch}</strong> is {measure.issue === 'too_high' ? 'above' : 'below'} the target instrument's range.
          </p>
          <p className="text-xs mt-1" style={{color:'rgba(250,248,240,0.4)'}}>
            Suggestion: shift {measure.suggestion === 'shift_down' ? 'down' : 'up'} one octave
          </p>
        </div>

        <div className="space-y-3">
          {measure.original_midi_url && (
            <MidiPlayer src={`${API}${measure.original_midi_url}`} label="Original measure" />
          )}
          {measure.shifted_midi_url && (
            <MidiPlayer src={`${API}${measure.shifted_midi_url}`} label={`Shifted ${measure.suggestion === 'shift_down' ? 'down' : 'up'} one octave`} />
          )}
        </div>

        <div className="flex gap-3 pt-2">
          <button className="btn-outline flex-1 py-2.5 rounded-lg text-sm" onClick={onSkip}>
            Keep original
          </button>
          <button className="btn-gold flex-1 py-2.5 rounded-lg text-sm" onClick={onAccept}>
            &#10003; Apply shift
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [file, setFile]             = useState(null);
  const [srcInst, setSrcInst]       = useState('violin');
  const [tgtInst, setTgtInst]       = useState('viola');
  const [instruments, setInstruments] = useState({});
  const [status, setStatus]         = useState('idle');
  const [error, setError]           = useState('');
  const [sessionId, setSessionId]   = useState(null);
  const [flagged, setFlagged]       = useState([]);
  const [wizardIdx, setWizardIdx]   = useState(0);
  const [shifts, setShifts]         = useState({});
  const [fullMidiUrl, setFullMidiUrl] = useState(null);
  const [dlPdfUrl, setDlPdfUrl]     = useState(null);
  const [dlMxlUrl, setDlMxlUrl]     = useState(null);
  const [isDragOver, setDragOver]   = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    fetch(`${API}/instruments`)
      .then(r => r.json())
      .then(setInstruments)
      .catch(() => {});
  }, []);

  const ACCEPT = '.mxl,.musicxml,.xml,.png,.jpg,.jpeg';

  const pick = useCallback((f) => {
    if (!f) return;
    const ext = f.name.split('.').pop().toLowerCase();
    if (!['mxl','musicxml','xml','png','jpg','jpeg'].includes(ext)) {
      setError(`Unsupported type .${ext}. Use MusicXML (.mxl, .musicxml) or image (.png, .jpg).`);
      setStatus('error'); return;
    }
    if (f.size > 10*1024*1024) {
      setError('File too large. Max 10MB.'); setStatus('error'); return;
    }
    setFile(f); setStatus('ready'); setError('');
    setDlPdfUrl(null); setDlMxlUrl(null); setFullMidiUrl(null);
  }, []);

  const onDrop = useCallback((e) => {
    e.preventDefault(); setDragOver(false); pick(e.dataTransfer.files[0]);
  }, [pick]);

  const convert = async () => {
    if (!file) return;
    setStatus('converting'); setError('');
    const fd = new FormData();
    fd.append('file', file);
    fd.append('source_instrument', srcInst);
    fd.append('target_instrument', tgtInst);
    try {
      const resp = await fetch(`${API}/convert-instrument`, { method:'POST', body:fd });
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        throw new Error(d.error || `Server error (${resp.status})`);
      }
      const data = await resp.json();
      setSessionId(data.session_id);
      setFullMidiUrl(`${API}${data.full_midi_url}`);
      setFlagged(data.flagged_measures || []);
      setShifts({});
      if ((data.flagged_measures || []).length > 0) {
        setWizardIdx(0);
        setStatus('wizard');
      } else {
        await doFinalize(data.session_id, {});
      }
    } catch (e) {
      setError(e.message); setStatus('error');
    }
  };

  const doFinalize = async (sid, approvedShifts) => {
    let gotDownload = false;

    // Try PDF first
    try {
      const resp = await fetch(`${API}/finalize`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sid, shifts: approvedShifts, format: 'pdf'}),
      });
      if (resp.ok) {
        const blob = await resp.blob();
        setDlPdfUrl(URL.createObjectURL(blob));
        gotDownload = true;
      } else if (resp.status === 503) {
        // PDF renderer unavailable — fall through to MusicXML
      }
    } catch (e) { /* try MXL */ }

    // If PDF failed, get MusicXML (session still exists if PDF call failed)
    if (!gotDownload) {
      try {
        const resp = await fetch(`${API}/finalize`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({session_id: sid, shifts: approvedShifts, format: 'musicxml'}),
        });
        if (resp.ok) {
          const blob = await resp.blob();
          setDlMxlUrl(URL.createObjectURL(blob));
        }
      } catch (e) { /* optional */ }
    }

    setStatus('done');
  };

  const wizardAccept = () => {
    const measure = flagged[wizardIdx];
    const newShifts = { ...shifts, [measure.measure_number]: measure.suggestion };
    setShifts(newShifts);
    advanceWizard(newShifts);
  };

  const wizardSkip = () => advanceWizard(shifts);

  const advanceWizard = async (currentShifts) => {
    if (wizardIdx + 1 < flagged.length) {
      setWizardIdx(wizardIdx + 1);
    } else {
      setStatus('converting');
      await doFinalize(sessionId, currentShifts);
    }
  };

  const reset = () => {
    setFile(null); setStatus('idle'); setError('');
    setSessionId(null); setFlagged([]); setWizardIdx(0); setShifts({});
    setFullMidiUrl(null); setDlPdfUrl(null); setDlMxlUrl(null);
  };

  const instOptions = Object.entries(instruments).map(([k, v]) => (
    <option key={k} value={k}>{v.name}</option>
  ));

  return (
    <div className="min-h-screen flex flex-col items-center py-12 px-4">
      {/* Wizard overlay */}
      {status === 'wizard' && flagged[wizardIdx] && (
        <WizardStep
          measure={flagged[wizardIdx]}
          total={flagged.length}
          current={wizardIdx + 1}
          onAccept={wizardAccept}
          onSkip={wizardSkip}
        />
      )}

      <div className="w-full max-w-xl space-y-8">
        {/* Header */}
        <div className="text-center space-y-2">
          <h1 className="text-4xl font-bold" style={{color:'var(--gold)'}}>ClefSwap</h1>
          <p className="text-sm" style={{color:'rgba(250,248,240,0.45)'}}>
            Convert sheet music between instruments — PDF + MIDI playback
          </p>
        </div>

        {/* Card */}
        <div className="rounded-2xl p-8 space-y-6" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)'}}>

          {/* Instrument selectors */}
          <div className="grid grid-cols-2 gap-4">
            <div className="space-y-1.5">
              <label className="text-xs font-medium" style={{color:'rgba(250,248,240,0.5)'}}>SOURCE INSTRUMENT</label>
              <select
                className="w-full rounded-lg px-3 py-2.5 text-sm"
                value={srcInst}
                onChange={e => setSrcInst(e.target.value)}
                disabled={status === 'converting' || status === 'wizard'}
              >
                {instOptions}
              </select>
            </div>
            <div className="space-y-1.5">
              <label className="text-xs font-medium" style={{color:'rgba(250,248,240,0.5)'}}>TARGET INSTRUMENT</label>
              <select
                className="w-full rounded-lg px-3 py-2.5 text-sm"
                value={tgtInst}
                onChange={e => setTgtInst(e.target.value)}
                disabled={status === 'converting' || status === 'wizard'}
              >
                {instOptions}
              </select>
            </div>
          </div>

          {/* Drop zone */}
          {(status === 'idle' || status === 'ready' || status === 'error') && (
            <div
              className={`drop-zone rounded-xl p-8 text-center cursor-pointer${isDragOver ? ' over' : ''}`}
              onClick={() => inputRef.current?.click()}
              onDragOver={e => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={onDrop}
            >
              <input ref={inputRef} type="file" accept={ACCEPT} className="hidden"
                onChange={e => pick(e.target.files[0])} />
              {file ? (
                <div className="space-y-1">
                  <p className="font-semibold text-sm" style={{color:'var(--gold)'}}>{file.name}</p>
                  <p className="text-xs" style={{color:'rgba(250,248,240,0.4)'}}>{fmtBytes(file.size)}</p>
                </div>
              ) : (
                <div className="space-y-2">
                  <p className="text-sm" style={{color:'rgba(250,248,240,0.5)'}}>Drop sheet music here or click to browse</p>
                  <p className="text-xs" style={{color:'rgba(250,248,240,0.3)'}}>PNG, JPG, MusicXML (.mxl, .musicxml) — max 10MB</p>
                </div>
              )}
            </div>
          )}

          {/* Error */}
          {status === 'error' && error && (
            <div className="rounded-lg p-3 text-sm" style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',color:'#fca5a5'}}>
              {error}
            </div>
          )}

          {/* Converting spinner */}
          {status === 'converting' && (
            <div className="flex flex-col items-center gap-3 py-6">
              <div className="spinner"></div>
              <p className="text-sm" style={{color:'rgba(250,248,240,0.4)'}}>Processing&#8230;</p>
            </div>
          )}

          {/* Done state */}
          {status === 'done' && (
            <div className="space-y-5">
              <div className="rounded-lg p-3 text-sm text-center" style={{background:'rgba(34,197,94,0.1)',border:'1px solid rgba(34,197,94,0.2)',color:'#86efac'}}>
                &#10003; Conversion complete
              </div>

              {fullMidiUrl && (
                <div className="space-y-2">
                  <p className="text-xs font-medium" style={{color:'rgba(250,248,240,0.5)'}}>PLAYBACK</p>
                  <MidiPlayer src={fullMidiUrl} />
                </div>
              )}

              <div className="flex gap-3">
                {dlPdfUrl && (
                  <a href={dlPdfUrl} download="converted.pdf" className="btn-gold flex-1 py-2.5 rounded-lg text-sm text-center">
                    &#8595; Download PDF
                  </a>
                )}
                {dlMxlUrl && (
                  <a href={dlMxlUrl} download="converted.musicxml" className="btn-outline flex-1 py-2.5 rounded-lg text-sm text-center">
                    &#8595; MusicXML
                  </a>
                )}
                {fullMidiUrl && (
                  <a href={fullMidiUrl} download="converted.mid" className="btn-outline flex-1 py-2.5 rounded-lg text-sm text-center">
                    &#8595; MIDI
                  </a>
                )}
              </div>
            </div>
          )}

          {/* Convert button */}
          {(status === 'idle' || status === 'ready' || status === 'error') && (
            <button
              className="btn-gold w-full py-3 rounded-xl text-sm"
              disabled={!file || status !== 'ready' || srcInst === tgtInst}
              onClick={convert}
            >
              {srcInst === tgtInst ? 'Select different instruments' : 'Convert \u2192'}
            </button>
          )}

          {/* Reset button */}
          {status === 'done' && (
            <button className="btn-outline w-full py-2.5 rounded-xl text-sm" onClick={reset}>
              Convert another file
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
