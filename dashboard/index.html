<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClefSwap — Build Dashboard</title>
  <style>
    /* ── Reset & base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0f0f1a;
      --navy-mid:  #16162a;
      --navy-card: #1c1c32;
      --navy-edge: #252540;
      --gold:      #e2b714;
      --gold-dim:  #a07d0a;
      --gold-glow: rgba(226,183,20,0.15);
      --cream:     #f0ead6;
      --cream-dim: rgba(240,234,214,0.55);
      --green:     #22c55e;
      --green-dim: rgba(34,197,94,0.15);
      --blue:      #60a5fa;
      --blue-dim:  rgba(96,165,250,0.15);
      --orange:    #fb923c;
      --orange-dim:rgba(251,146,60,0.15);
      --red:       #f87171;
      --red-dim:   rgba(248,113,113,0.15);
      --yellow:    #fbbf24;
      --yellow-dim:rgba(251,191,36,0.15);
      --purple:    #a78bfa;
      --muted:     rgba(240,234,214,0.35);
    }

    html { font-size: 14px; }
    body {
      background: var(--navy);
      color: var(--cream);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Scrollbar ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: var(--navy-edge); border-radius: 3px; }

    /* ── Layout ────────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 1fr;
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--navy-edge);
      background: var(--navy-mid);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--gold);
    }

    .logo-sep {
      color: var(--navy-edge);
      font-size: 1.4rem;
      font-weight: 200;
    }

    .header-subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-ring 2s cubic-bezier(0.455,0.03,0.515,0.955) infinite;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70%  { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }

    .refresh-label {
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Main content ──────────────────────────────── */
    .content {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 0;
      height: calc(100vh - 56px);
    }

    /* ── Summary bar ───────────────────────────────── */
    .summary-bar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 14px 24px;
      background: var(--navy-mid);
      border-bottom: 1px solid var(--navy-edge);
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-divider {
      width: 1px;
      height: 32px;
      background: var(--navy-edge);
    }

    .progress-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .progress-pct {
      font-size: 0.7rem;
      color: var(--gold);
      font-weight: 700;
    }

    .progress-track {
      height: 6px;
      background: var(--navy-edge);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius: 3px;
      transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
    }

    .renderer-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid;
    }

    .renderer-badge.lilypond {
      color: var(--green);
      border-color: rgba(34,197,94,0.3);
      background: var(--green-dim);
    }

    .renderer-badge.none {
      color: var(--red);
      border-color: rgba(248,113,113,0.3);
      background: var(--red-dim);
    }

    /* ── Task grid panel ───────────────────────────── */
    .task-panel {
      grid-column: 1;
      grid-row: 2;
      padding: 20px 24px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .task-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    /* ── Task card ─────────────────────────────────── */
    .task-card {
      background: var(--navy-card);
      border: 1px solid var(--navy-edge);
      border-radius: 10px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.15s;
      cursor: default;
    }

    .task-card:hover {
      border-color: rgba(226,183,20,0.25);
      transform: translateY(-1px);
    }

    .task-card.status-completed {
      border-color: rgba(34,197,94,0.2);
    }

    .task-card.status-completed::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(34,197,94,0.04), transparent 60%);
      pointer-events: none;
    }

    .task-card.status-in_progress {
      border-color: rgba(226,183,20,0.4);
      box-shadow: 0 0 20px rgba(226,183,20,0.06);
    }

    .task-card.status-in_progress::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(226,183,20,0.06), transparent 60%);
      pointer-events: none;
    }

    /* Shimmer on active task */
    .task-card.status-in_progress::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(226,183,20,0.06), transparent);
      animation: shimmer 2.4s infinite;
    }

    @keyframes shimmer {
      0%   { left: -60%; }
      100% { left: 140%; }
    }

    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .task-id-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-id {
      font-size: 0.65rem;
      color: var(--muted);
      background: var(--navy-edge);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .task-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    .status-pill.completed {
      color: var(--green);
      background: var(--green-dim);
      border-color: rgba(34,197,94,0.25);
    }

    .status-pill.in_progress {
      color: var(--gold);
      background: var(--gold-glow);
      border-color: rgba(226,183,20,0.3);
    }

    .status-pill.pending {
      color: var(--muted);
      background: rgba(240,234,214,0.04);
      border-color: var(--navy-edge);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-dot.spinning {
      animation: pulse-ring 1.5s ease infinite;
    }

    .task-desc {
      font-size: 0.72rem;
      color: var(--cream-dim);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .task-files {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .file-chip {
      font-size: 0.62rem;
      color: var(--muted);
      background: var(--navy-edge);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      transition: color 0.2s;
    }

    .status-completed .file-chip {
      color: rgba(34,197,94,0.65);
      background: rgba(34,197,94,0.07);
    }

    .status-in_progress .file-chip {
      color: rgba(226,183,20,0.7);
      background: rgba(226,183,20,0.07);
    }

    .task-notes {
      margin-top: 9px;
      font-size: 0.68rem;
      color: var(--yellow);
      background: var(--yellow-dim);
      border: 1px solid rgba(251,191,36,0.2);
      border-radius: 6px;
      padding: 6px 9px;
      line-height: 1.45;
    }

    /* ── Right panel — log & agents ────────────────── */
    .right-panel {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--navy-edge);
      overflow: hidden;
    }

    /* Activity strip */
    .activity-strip {
      padding: 14px 16px;
      border-bottom: 1px solid var(--navy-edge);
      background: var(--navy-mid);
    }

    .activity-label {
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .activity-text {
      font-size: 0.75rem;
      color: var(--gold);
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    .activity-spinner {
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(226,183,20,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Agents panel */
    .agents-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--navy-edge);
    }

    .agents-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .agent-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid var(--navy-edge);
      background: var(--navy-card);
    }

    .agent-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    .agent-info {
      flex: 1;
      min-width: 0;
    }

    .agent-role {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: 0.02em;
    }

    .agent-status {
      font-size: 0.62rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agent-badge {
      font-size: 0.58rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .agent-badge.active   { color: var(--gold);  background: var(--gold-glow); }
    .agent-badge.done     { color: var(--green); background: var(--green-dim); }
    .agent-badge.idle     { color: var(--muted); background: var(--navy-edge); }
    .agent-badge.reviewer { color: var(--purple); background: rgba(167,139,250,0.12); }

    /* Log panel */
    .log-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px 0 0;
    }

    .log-section .section-title {
      padding: 0 16px;
    }

    .log-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 16px;
    }

    .log-entry {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.68rem;
      line-height: 1.4;
      align-items: baseline;
    }

    .log-entry:hover { background: rgba(255,255,255,0.03); }

    .log-time {
      color: var(--muted);
      font-size: 0.6rem;
      text-align: right;
    }

    .log-msg { color: var(--cream-dim); }

    .log-entry.level-success .log-msg { color: var(--green); }
    .log-entry.level-agent   .log-msg { color: var(--blue); }
    .log-entry.level-warning .log-msg { color: var(--yellow); }
    .log-entry.level-fix     .log-msg { color: var(--orange); }
    .log-entry.level-error   .log-msg { color: var(--red); }

    .log-icon {
      margin-right: 4px;
    }

    /* ── Tooltip ───────────────────────────────────── */
    [data-tooltip] { position: relative; }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy-card);
      border: 1px solid var(--navy-edge);
      color: var(--cream);
      font-size: 0.65rem;
      padding: 5px 9px;
      border-radius: 5px;
      white-space: nowrap;
      z-index: 200;
      pointer-events: none;
    }

    /* ── Scan line animation (subtle) ──────────────── */
    @keyframes scanline {
      0%   { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- ── Header ─────────────────────────────────── -->
  <header>
    <div class="header-left">
      <span class="logo">𝄞 ClefSwap</span>
      <span class="logo-sep">|</span>
      <span class="header-subtitle">Build Dashboard</span>
    </div>
    <div class="header-right">
      <div class="pulse-dot"></div>
      <span class="refresh-label" id="refresh-label">Polling every 3s</span>
    </div>
  </header>

  <div class="content">

    <!-- ── Summary bar ────────────────────────────── -->
    <div class="summary-bar">
      <div class="stat">
        <span class="stat-value" id="stat-completed" style="color:var(--green)">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="stat-active" style="color:var(--gold)">0</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="stat-pending" style="color:var(--muted)">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-divider"></div>
      <div class="progress-container">
        <div class="progress-header">
          <span class="progress-label">Overall Progress</span>
          <span class="progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div class="stat-divider"></div>
      <div class="renderer-badge" id="renderer-badge">
        <span class="status-dot"></span>
        <span id="renderer-name">detecting…</span>
      </div>
    </div>

    <!-- ── Task grid ───────────────────────────────── -->
    <div class="task-panel">
      <div class="section-title">Tasks — 10 total</div>
      <div class="task-grid" id="task-grid">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- ── Right panel ────────────────────────────── -->
    <div class="right-panel">

      <!-- Current activity -->
      <div class="activity-strip">
        <div class="activity-label">Current Activity</div>
        <div class="activity-text">
          <div class="activity-spinner" id="activity-spinner"></div>
          <span id="activity-text">Loading…</span>
        </div>
      </div>

      <!-- Agents -->
      <div class="agents-section">
        <div class="section-title">Subagents</div>
        <div class="agents-grid" id="agents-grid">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- Event log -->
      <div class="log-section">
        <div class="section-title">Event Log</div>
        <div class="log-scroll" id="log-scroll">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const LOG_ICONS = {
    info:    'ℹ',
    success: '✓',
    agent:   '⟳',
    warning: '⚠',
    fix:     '⚙',
    error:   '✗',
  };

  const AGENT_DEFS = [
    { role: 'Implementer',    icon: '🔧', desc: 'Writes code, runs tests, commits' },
    { role: 'Spec Reviewer',  icon: '📋', desc: 'Checks spec compliance' },
    { role: 'Quality Reviewer',icon:'🔍', desc: 'Reviews code quality' },
  ];

  let prevLogCount = 0;
  let prevCompleted = -1;

  function formatTime(iso) {
    // Show as HH:MM:SS
    const d = new Date(iso);
    return d.toTimeString().slice(0,8);
  }

  function deriveAgentStates(state) {
    const completed = state.tasks.filter(t => t.status === 'completed').length;
    const activeTask = state.tasks.find(t => t.status === 'in_progress');
    const log = state.log;
    const lastAgent = [...log].reverse().find(e => e.level === 'agent');
    const lastSuccess = [...log].reverse().find(e => e.level === 'success');

    // Implementer
    let implStatus = 'idle';
    let implDesc = 'Waiting for next task';
    if (activeTask) { implStatus = 'active'; implDesc = `Task ${activeTask.id}: ${activeTask.name}`; }

    // Spec reviewer
    let specStatus = 'idle';
    let specDesc = 'Waiting';
    const specLog = [...log].reverse().find(e => e.msg.toLowerCase().includes('spec review'));
    if (specLog) {
      if (specLog.level === 'agent') { specStatus = 'reviewer'; specDesc = 'Reviewing…'; }
      else if (specLog.level === 'success') { specStatus = 'done'; specDesc = 'Spec compliant ✓'; }
      else if (specLog.level === 'warning') { specStatus = 'reviewer'; specDesc = 'Found gaps — pending fix'; }
    }

    // Quality reviewer
    let qualStatus = 'idle';
    let qualDesc = 'Waiting';
    const qualLog = [...log].reverse().find(e => e.msg.toLowerCase().includes('quality') || e.msg.toLowerCase().includes('code review'));
    if (qualLog) {
      if (qualLog.level === 'agent') { qualStatus = 'reviewer'; qualDesc = 'Reviewing…'; }
      else if (qualLog.level === 'success') { qualStatus = 'done'; qualDesc = 'Quality approved ✓'; }
    }

    return [
      { role: 'Implementer',     icon: '🔧', status: implStatus, desc: implDesc },
      { role: 'Spec Reviewer',   icon: '📋', status: specStatus, desc: specDesc },
      { role: 'Quality Reviewer',icon: '🔍', status: qualStatus, desc: qualDesc },
    ];
  }

  function render(state) {
    // ── Stats ──────────────────────────────────────
    const completed = state.tasks.filter(t => t.status === 'completed').length;
    const active    = state.tasks.filter(t => t.status === 'in_progress').length;
    const pending   = state.tasks.filter(t => t.status === 'pending').length;
    const total     = state.totalTasks;
    const pct       = Math.round(completed / total * 100);

    document.getElementById('stat-completed').textContent = completed;
    document.getElementById('stat-active').textContent    = active;
    document.getElementById('stat-pending').textContent   = pending;
    document.getElementById('progress-pct').textContent   = pct + '%';
    document.getElementById('progress-fill').style.width  = pct + '%';

    // ── Renderer badge ─────────────────────────────
    const badge = document.getElementById('renderer-badge');
    const rendName = document.getElementById('renderer-name');
    badge.className = 'renderer-badge ' + (state.renderer || 'none');
    rendName.textContent = state.renderer === 'lilypond' ? '🎼 LilyPond 2.24.4'
                         : state.renderer === 'musescore' ? '🎵 MuseScore'
                         : '⚠ No renderer';

    // ── Activity ───────────────────────────────────
    document.getElementById('activity-text').textContent = state.currentActivity || 'Idle';
    const spinner = document.getElementById('activity-spinner');
    spinner.style.display = (active > 0 || state.currentActivity) ? 'block' : 'none';

    // ── Task grid ──────────────────────────────────
    const grid = document.getElementById('task-grid');
    if (prevCompleted !== completed || grid.children.length === 0) {
      grid.innerHTML = '';
      state.tasks.forEach(t => {
        const card = document.createElement('div');
        card.className = `task-card status-${t.status}`;

        const statusLabel = t.status === 'in_progress' ? 'Active' : t.status.replace('_', ' ');
        const statusClass = t.status === 'in_progress' ? 'in_progress' : t.status;
        const dotClass    = t.status === 'in_progress' ? 'spinning' : '';

        const filesHtml = (t.files || []).map(f =>
          `<span class="file-chip">${f}</span>`
        ).join('');

        const notesHtml = t.notes
          ? `<div class="task-notes">💡 ${t.notes}</div>`
          : '';

        card.innerHTML = `
          <div class="task-header">
            <div class="task-id-name">
              <span class="task-id">#${String(t.id).padStart(2,'0')}</span>
              <span class="task-name">${t.name}</span>
            </div>
            <span class="status-pill ${statusClass}">
              <span class="status-dot ${dotClass}"></span>
              ${statusLabel}
            </span>
          </div>
          <div class="task-desc">${t.description}</div>
          <div class="task-files">${filesHtml}</div>
          ${notesHtml}
        `;
        grid.appendChild(card);
      });
      prevCompleted = completed;
    }

    // ── Agents ─────────────────────────────────────
    const agents = deriveAgentStates(state);
    const agentsGrid = document.getElementById('agents-grid');
    agentsGrid.innerHTML = '';
    agents.forEach(a => {
      const row = document.createElement('div');
      row.className = 'agent-row';
      row.innerHTML = `
        <span class="agent-icon">${a.icon}</span>
        <div class="agent-info">
          <div class="agent-role">${a.role}</div>
          <div class="agent-status">${a.desc}</div>
        </div>
        <span class="agent-badge ${a.status}">${
          a.status === 'active'   ? 'RUNNING' :
          a.status === 'done'     ? 'DONE'    :
          a.status === 'reviewer' ? 'REVIEW'  : 'IDLE'
        }</span>
      `;
      agentsGrid.appendChild(row);
    });

    // ── Log ────────────────────────────────────────
    const logScroll = document.getElementById('log-scroll');
    const newEntries = state.log.slice(prevLogCount);
    const atBottom = logScroll.scrollHeight - logScroll.scrollTop - logScroll.clientHeight < 40;

    if (newEntries.length > 0 || logScroll.children.length === 0) {
      if (logScroll.children.length === 0) {
        // Initial render: show all
        logScroll.innerHTML = '';
        state.log.forEach(e => logScroll.appendChild(makeLogEntry(e)));
      } else {
        newEntries.forEach(e => logScroll.appendChild(makeLogEntry(e)));
      }
      prevLogCount = state.log.length;
      if (atBottom) logScroll.scrollTop = logScroll.scrollHeight;
    }
  }

  function makeLogEntry(e) {
    const div = document.createElement('div');
    div.className = `log-entry level-${e.level}`;
    const icon = LOG_ICONS[e.level] || '·';
    const t = e.time ? formatTime(e.time) : '--:--:--';
    div.innerHTML = `
      <span class="log-time">${t}</span>
      <span class="log-msg"><span class="log-icon">${icon}</span>${e.msg}</span>
    `;
    return div;
  }

  // ── Polling ───────────────────────────────────────
  async function fetchState() {
    try {
      const res = await fetch('./state.json?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data);
      document.getElementById('refresh-label').textContent = 'Updated ' + new Date().toTimeString().slice(0,8);
    } catch (err) {
      console.warn('Fetch failed:', err);
      document.getElementById('refresh-label').textContent = 'Retrying…';
    }
  }

  fetchState();
  setInterval(fetchState, 3000);
</script>
</body>
</html>
